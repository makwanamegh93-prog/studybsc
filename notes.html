<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBSc - BSc Preparation Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#244ca3', 
                        accent: '#ffcc00',  
                        surface: '#f9fafb', 
                        pdfred: '#e53935'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #ffffff; }
        .tab-active {
            color: #244ca3;
            border-bottom: 2px solid #244ca3;
            font-weight: 600;
        }
        .filter-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="text-gray-800 antialiased font-sans flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="border-b border-gray-100 py-3 px-6 md:px-12 flex items-center justify-between bg-white">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="bg-black text-accent font-bold text-xl h-10 w-10 flex items-center justify-center rounded-lg">
                SB
            </div>
            <span class="font-bold text-xl hidden sm:block">StudyBSc</span>
        </div>
        
        <div class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
            <a href="index.html" class="hover:text-primary transition-colors">Home</a>
            <a href="#" class="hover:text-primary transition-colors">About</a>
            <a href="notes.html" class="text-gray-900 hover:text-primary transition-colors">Study Material <i class="ph ph-caret-down inline-block align-middle"></i></a>
            <a href="#" class="hover:text-primary transition-colors">Exam Prep <i class="ph ph-caret-down inline-block align-middle"></i></a>
            <a href="#" class="hover:text-primary transition-colors">Career</a>
        </div>

        <div class="flex items-center gap-4">
            <div class="h-8 w-8 rounded-full bg-gray-200 overflow-hidden cursor-pointer">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="h-full w-full object-cover">
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="px-6 md:px-12 pt-6 pb-4 bg-white">
        <div class="flex items-center gap-2 text-xs text-gray-500 font-medium uppercase tracking-wide mb-4">
            <i class="ph ph-house text-sm"></i>
            <i class="ph ph-caret-right"></i>
            <span>EXAM PREP</span>
            <i class="ph ph-caret-right"></i>
            <span>EXAMS</span>
            <i class="ph ph-caret-right"></i>
            <span class="text-gray-800">NOTES</span>
        </div>
        
        <div class="flex justify-between items-start">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight">BSc DEGREE PREPARATION</h1>
            <button class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                <i class="ph ph-share-network"></i> Share
            </button>
        </div>
    </div>

    <!-- Sub-Navigation Tabs -->
    <div class="bg-blue-50/50 border-y border-gray-200 px-6 md:px-12 flex gap-8 overflow-x-auto">
        <a href="#" class="py-4 tab-active whitespace-nowrap">Notes</a>
        <a href="#" class="py-4 text-gray-500 hover:text-primary font-medium whitespace-nowrap">Syllabus</a>
    </div>

    <!-- Filters -->
    <div class="px-6 md:px-12 py-4 flex gap-4 overflow-x-auto border-b border-gray-100">
        <div class="flex items-center border border-gray-300 rounded-full px-4 py-1.5 bg-white">
            <span class="text-sm text-gray-500 mr-2">Branch:</span>
            <select id="filter-branch" class="filter-select text-sm font-medium text-primary bg-transparent pr-6 focus:outline-none cursor-pointer">
                <option>Microbiology</option>
                <option>Mathematics</option>
            </select>
        </div>
        <div class="flex items-center border border-gray-300 rounded-full px-4 py-1.5 bg-white">
            <span class="text-sm text-gray-500 mr-2">Level:</span>
            <select id="filter-level" class="filter-select text-sm font-medium text-primary bg-transparent pr-6 focus:outline-none cursor-pointer">
                <option>Sem 1</option>
                <option>Sem 2</option>
                <option>Sem 3</option>
                <option>Sem 4</option>
                <option>Sem 5</option>
                <option>Sem 6</option>
            </select>
        </div>
        <div class="flex items-center border border-gray-300 rounded-full px-4 py-1.5 bg-white">
            <select id="filter-subject" class="filter-select text-sm font-medium text-gray-700 bg-transparent pr-6 focus:outline-none cursor-pointer">
                <!-- Subject options will be injected by JavaScript based on Branch -->
            </select>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-6 md:px-12 py-8 relative">
        
        <!-- Breadcrumb inside content -->
        <div class="text-sm text-primary mb-8 font-medium flex items-center gap-2">
            <a href="#" class="hover:underline">Notes</a> 
            <i class="ph ph-caret-right text-gray-400"></i> 
            <a href="#" id="breadcrumb-branch" class="hover:underline">Microbiology</a> 
            <i class="ph ph-caret-right text-gray-400"></i> 
            <span id="breadcrumb-level">Sem 1</span>
        </div>

        <!-- Section container -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="section-title" class="text-xl font-bold text-gray-900">SEC (Minor)</h2>
                <button class="flex items-center gap-2 px-3 py-1.5 border border-gray-200 rounded text-xs font-medium text-gray-600 hover:bg-gray-50">
                    <i class="ph ph-share-network"></i> Share
                </button>
            </div>

            <!-- Notes Grid -->
            <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be rendered here by JavaScript -->
            </div>
        </div>

        <!-- Floating QR / Scan widget placeholder -->
        <div class="fixed right-0 top-1/3 bg-primary text-white p-2 rounded-l-xl shadow-lg border border-blue-400 flex flex-col items-center hidden md:flex">
            <div class="bg-white p-1 rounded mb-1">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=studybsc" alt="QR" class="w-12 h-12">
            </div>
            <span class="text-[10px] font-bold">Scan Me</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-100 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-6 md:px-12 text-center text-gray-500 text-sm">
            &copy; 2026 StudyBSc. All rights reserved.
        </div>
    </footer>

    <!-- JavaScript to handle filtering -->
    <script>
        // Database array containing your uploaded study notes
        const notesDatabase = [
            { 
                branch: 'Microbiology', 
                level: 'Sem 1', 
                subject: 'SEC (Minor)', 
                title: 'Preview', 
                downloads: '1',
                viewUrl: 'https://drive.google.com/file/d/1nZrIjrnBUjtgBU66L-aCaLmsAoW5mktw/view?usp=drive_link',
                downloadUrl: 'https://drive.google.com/file/d/1nZrIjrnBUjtgBU66L-aCaLmsAoW5mktw/view?usp=drive_link'
            }
        ];

        // Elements
        const filterBranch = document.getElementById('filter-branch');
        const filterLevel = document.getElementById('filter-level');
        const filterSubject = document.getElementById('filter-subject');
        
        const breadcrumbBranch = document.getElementById('breadcrumb-branch');
        const breadcrumbLevel = document.getElementById('breadcrumb-level');
        const sectionTitle = document.getElementById('section-title');
        const notesGrid = document.getElementById('notes-grid');

        // Branch to Subject mapping
        const branchSubjects = {
            'Microbiology': [
                'Microbiology Practical (Major)',
                'Microbiology',
                'Zoology (Minor)',
                'Chemistry (Minor)',
                'SEC (Minor)',
                'I.K.S.',
                'Chemistry Practical (Minor)',
                'Zoology Practical (Minor)'
            ],
            'Mathematics': [
                'Maths'
            ]
        };

        function updateSubjectOptions() {
            const selectedBranch = filterBranch.value;
            const subjects = branchSubjects[selectedBranch] || [];
            
            filterSubject.innerHTML = '<option value="All">All Subjects</option>';
            subjects.forEach(sub => {
                filterSubject.innerHTML += `<option value="${sub}">${sub}</option>`;
            });

            // Re-render notes after subjects are updated
            renderNotes();
        }

        // Render Function
        function renderNotes() {
            const selectedBranch = filterBranch.value;
            const selectedLevel = filterLevel.value;
            const selectedSubject = filterSubject.value;

            // Update Header Text
            breadcrumbBranch.textContent = selectedBranch;
            breadcrumbLevel.textContent = selectedLevel;
            sectionTitle.textContent = selectedSubject === 'All' ? `${selectedBranch} - All Subjects` : selectedSubject;

            // Filter data
            const filteredNotes = notesDatabase.filter(note => {
                const matchBranch = note.branch === selectedBranch;
                const matchLevel = note.level === selectedLevel;
                const matchSubject = selectedSubject === 'All' || note.subject === selectedSubject;
                return matchBranch && matchLevel && matchSubject;
            });

            // Generate HTML
            notesGrid.innerHTML = '';
            
            if (filteredNotes.length === 0) {
                notesGrid.innerHTML = `
                <div class="col-span-full py-16 flex flex-col items-center justify-center text-gray-500">
                    <i class="ph ph-folder-open text-6xl text-gray-300 mb-4"></i>
                    <p class="text-xl font-bold text-gray-900 mb-2">No notes uploaded yet</p>
                    <p class="text-sm">Study materials for this section haven't been added to the database yet.</p>
                </div>`;
                return;
            }

            filteredNotes.forEach(note => {
                const cardHTML = `
                    <div class="border border-gray-200 rounded-xl p-5 hover:shadow-md transition bg-white flex flex-col h-full">
                        <div class="flex justify-between items-start mb-4">
                            <i class="ph-fill ph-file-pdf text-4xl text-pdfred"></i>
                            <span class="text-xs text-gray-400 flex items-center gap-1"><i class="ph ph-download-simple"></i> ${note.downloads || '1'}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-2">${note.title}</h3>
                        <p class="text-sm text-gray-500 mb-6 flex-grow">Notes and practice for ${note.title} (${note.subject})</p>
                        
                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <a href="${note.viewUrl || '#'}" target="_blank" class="text-center border border-primary text-primary font-semibold text-sm py-2 rounded-lg hover:bg-blue-50 transition">VIEW</a>
                            <a href="${note.downloadUrl || '#'}" target="_blank" class="text-center bg-primary text-white font-semibold text-sm py-2 rounded-lg hover:bg-blue-800 transition">GET PDF</a>
                        </div>
                    </div>
                `;
                notesGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Event Listeners
        filterBranch.addEventListener('change', updateSubjectOptions);
        filterLevel.addEventListener('change', renderNotes);
        filterSubject.addEventListener('change', renderNotes);

        // Check URL for branch parameter to set initial state
        const urlParams = new URLSearchParams(window.location.search);
        const branchParam = urlParams.get('branch');
        
        if (branchParam) {
            for (let i = 0; i < filterBranch.options.length; i++) {
                if (filterBranch.options[i].text === branchParam) {
                    filterBranch.selectedIndex = i;
                    break;
                }
            }
        }

        // Initial Render
        updateSubjectOptions();
    </script>
</body>
</html>
