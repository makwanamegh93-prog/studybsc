<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBSc - Study Materials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0f172a',
                        accent: '#3b82f6',
                        pdf: '#ef4444'
                    },
                    keyframes: {
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 2s infinite'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.25rem center;
            background-size: 1.2em;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased font-sans flex flex-col min-h-screen selection:bg-accent selection:text-white">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 transition-all">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="bg-primary text-white font-bold text-lg h-9 w-9 flex items-center justify-center rounded-xl group-hover:rotate-3 transition-transform">
                    SB
                </div>
                <span class="font-bold text-xl tracking-tight text-primary">StudyBSc</span>
            </a>
            
            <div class="bg-gray-100 p-1 rounded-full flex text-sm font-medium w-full sm:w-auto">
                <button class="flex-1 sm:flex-none px-6 py-2 bg-white text-primary rounded-full shadow-sm">Notes</button>
                <button class="flex-1 sm:flex-none px-6 py-2 text-slate-500 hover:text-primary transition-colors">Syllabus</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-6xl mx-auto px-6 py-8 md:py-12">
        
        <!-- Header -->
        <div class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-primary tracking-tight mb-2"><span id="page-branch-title">Microbiology</span> Materials</h1>
                <p class="text-slate-500">Access and download your course resources.</p>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm mb-10 flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <select id="filter-level" class="custom-select w-full bg-gray-50 border border-gray-100 text-slate-700 text-sm font-semibold rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all cursor-pointer hover:bg-gray-100">
                    <option>Sem 1</option>
                    <option>Sem 2</option>
                    <option>Sem 3</option>
                    <option>Sem 4</option>
                    <option>Sem 5</option>
                    <option>Sem 6</option>
                </select>
            </div>
            <div class="relative flex-1 md:flex-[2]">
                <select id="filter-subject" class="custom-select w-full bg-gray-50 border border-gray-100 text-slate-700 text-sm font-semibold rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all cursor-pointer hover:bg-gray-100">
                    <!-- Options injected -->
                </select>
            </div>
        </div>

        <!-- Content Area -->
        <div>
            <div class="flex items-center gap-3 mb-6 bg-white px-4 py-3 rounded-xl border border-gray-100 shadow-sm w-max max-w-full">
                <div class="h-2 w-2 rounded-full bg-accent animate-pulse"></div>
                <h2 id="section-title" class="text-base font-bold text-primary truncate">SEC (Minor)</h2>
            </div>

            <!-- Notes Grid -->
            <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                <!-- Rendered by JS -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-6 text-center flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-primary text-white font-bold text-xs h-6 w-6 flex items-center justify-center rounded-md">SB</div>
                <span class="font-semibold text-primary text-sm">StudyBSc</span>
            </div>
            <p class="text-slate-400 text-sm">&copy; 2026. Designed for excellence.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        const notesDatabase = [
            { 
                branch: 'Microbiology', level: 'Sem 1', subject: 'SEC (Minor)', 
                title: 'Preview', type: 'PDF', size: '1.2 MB',
                viewUrl: 'https://drive.google.com/file/d/1nZrIjrnBUjtgBU66L-aCaLmsAoW5mktw/view?usp=drive_link', 
                downloadUrl: 'https://drive.google.com/file/d/1nZrIjrnBUjtgBU66L-aCaLmsAoW5mktw/view?usp=drive_link'
            },
            { 
                branch: 'Microbiology', level: 'Sem 1', subject: 'SEC (Minor)', 
                title: 'Unit 1', type: 'PDF', size: '3.4 MB',
                viewUrl: 'https://drive.google.com/file/d/1J9uqDOfPWZFA1iMJHkGqzB0aFcO3IbFZ/view?usp=drive_link', 
                downloadUrl: 'https://drive.google.com/file/d/1J9uqDOfPWZFA1iMJHkGqzB0aFcO3IbFZ/view?usp=drive_link'
            },
            { 
                branch: 'Microbiology', level: 'Sem 1', subject: 'SEC (Minor)', 
                title: 'Unit 2', type: 'PDF', size: '2.8 MB',
                viewUrl: 'https://drive.google.com/file/d/1n5iQrKWq9O3crtWq_1nLJ3yKn-JuzTXK/view?usp=drive_link', 
                downloadUrl: 'https://drive.google.com/file/d/1n5iQrKWq9O3crtWq_1nLJ3yKn-JuzTXK/view?usp=drive_link'
            }
        ];

        const filterLevel = document.getElementById('filter-level');
        const filterSubject = document.getElementById('filter-subject');
        const sectionTitle = document.getElementById('section-title');
        const notesGrid = document.getElementById('notes-grid');
        const pageBranchTitle = document.getElementById('page-branch-title');

        const branchSubjects = {
            'Microbiology': ['Microbiology Practical (Major)', 'Microbiology', 'Zoology (Minor)', 'Chemistry (Minor)', 'SEC (Minor)', 'I.K.S.', 'Chemistry Practical (Minor)', 'Zoology Practical (Minor)'],
            'Mathematics': ['Maths']
        };

        // Determine current branch from URL
        let currentBranch = 'Microbiology';
        const urlParams = new URLSearchParams(window.location.search);
        const branchParam = urlParams.get('branch');
        if (branchParam && branchSubjects[branchParam]) {
            currentBranch = branchParam;
        }
        
        // Set the dynamic title
        pageBranchTitle.textContent = currentBranch;

        function updateSubjectOptions() {
            const subjects = branchSubjects[currentBranch] || [];
            
            filterSubject.innerHTML = '';
            subjects.forEach(sub => {
                filterSubject.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
            renderNotes();
        }

        function renderNotes() {
            const selectedLevel = filterLevel.value;
            const selectedSubject = filterSubject.value;

            sectionTitle.textContent = selectedSubject;

            const filteredNotes = notesDatabase.filter(note => {
                return note.branch === currentBranch && 
                       note.level === selectedLevel && 
                       note.subject === selectedSubject;
            });

            notesGrid.innerHTML = '';
            
            if (filteredNotes.length === 0) {
                notesGrid.innerHTML = `
                <div class="col-span-full py-20 flex flex-col items-center justify-center text-center bg-white rounded-3xl border border-gray-100 border-dashed">
                    <div class="h-16 w-16 bg-gray-50 text-gray-300 rounded-full flex items-center justify-center text-3xl mb-4">
                        <i class="ph ph-folder-dashed"></i>
                    </div>
                    <h3 class="text-lg font-bold text-primary mb-1">No materials found</h3>
                    <p class="text-sm text-slate-500 max-w-sm">We couldn't find any documents matching your current filters. Try selecting a different subject or semester.</p>
                </div>`;
                return;
            }

            filteredNotes.forEach(note => {
                const cardHTML = `
                    <div class="group bg-white rounded-2xl border border-gray-100 p-5 shadow-sm hover:shadow-xl hover:border-accent/30 transition-all duration-300 flex flex-col h-full relative overflow-hidden">
                        
                        <div class="flex justify-between items-start mb-5">
                            <div class="h-12 w-12 bg-red-50 text-pdf rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform duration-300">
                                <i class="ph-fill ph-file-pdf"></i>
                            </div>
                            <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase bg-slate-50 px-2 py-1 rounded-md">${note.type || 'PDF'}</span>
                        </div>
                        
                        <h3 class="font-bold text-primary text-lg mb-1 leading-tight">${note.title}</h3>
                        <p class="text-sm text-slate-400 mb-6 flex-grow">Course material for ${note.subject}</p>
                        
                        <div class="flex gap-2 mt-auto">
                            <a href="${note.viewUrl}" target="_blank" class="flex-1 bg-gray-50 hover:bg-gray-100 text-slate-700 text-center text-sm font-semibold py-2.5 rounded-xl transition-colors">View</a>
                            <a href="${note.downloadUrl}" target="_blank" class="flex-1 bg-primary hover:bg-slate-800 text-white text-center text-sm font-semibold py-2.5 rounded-xl transition-colors shadow-sm">Download</a>
                        </div>
                    </div>
                `;
                notesGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        filterLevel.addEventListener('change', renderNotes);
        filterSubject.addEventListener('change', renderNotes);

        updateSubjectOptions();
    </script>
    <!-- WhatsApp Floating Action Button -->
    <a href="https://wa.me/919227838831" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-4 md:bottom-8 md:right-8 flex flex-col items-center gap-2 group z-50 transition-transform active:scale-90">
        <div class="relative flex items-center justify-center h-16 w-16 rounded-full bg-white/40 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] border border-white/60 overflow-hidden transition-all duration-500 group-hover:shadow-[0_0_20px_rgba(37,211,102,0.4)] group-hover:-translate-y-1">
            <!-- Shimmer -->
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/80 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
            <!-- Icon -->
            <i class="ph ph-whatsapp-logo text-[40px] text-[#25D366] relative z-10 group-hover:scale-110 transition-transform duration-500 ease-out drop-shadow-sm"></i>
        </div>
        <span class="text-[10px] font-semibold text-slate-500 text-center leading-tight">
            Support / Contact<br>Developer
        </span>
    </a>

</body>
</html>
