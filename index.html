<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBSc - Premium BSc Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0f172a', /* slate-900 */
                        accent: '#3b82f6',  /* blue-500 */
                    },
                    keyframes: {
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 2s infinite'
                    }
                }
            }
        }
    </script>
    <style>
        .glow-box {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .group:hover .glow-box,
        .group:active .glow-box {
            box-shadow: 0 0 25px -5px currentColor;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased font-sans flex flex-col min-h-screen selection:bg-accent selection:text-white pb-24 md:pb-0">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 transition-all">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="bg-primary text-white font-bold text-lg h-9 w-9 flex items-center justify-center rounded-xl group-hover:rotate-3 transition-transform">
                    SB
                </div>
                <span class="font-bold text-xl tracking-tight text-primary">StudyBSc</span>
            </a>
            
            <a href="notes.html" class="bg-primary hover:bg-slate-800 text-white text-sm font-medium py-2.5 px-5 sm:px-6 rounded-full transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                Get Started <i class="ph ph-arrow-right text-base"></i>
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 py-12 md:py-24 flex flex-col items-center justify-center">
        
        <div class="text-center mb-12 md:mb-16 max-w-3xl">
            <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-primary mb-6 tracking-tight leading-[1.15] md:leading-[1.1]">
                Make your college life<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-indigo-600">easy.</span>
            </h1>
            <p class="text-lg sm:text-xl md:text-2xl font-bold tracking-tight mb-8 md:mb-10 leading-relaxed max-w-2xl mx-auto px-2 flex flex-wrap items-center justify-center gap-2 sm:gap-2.5">
                <span class="bg-blue-50 border border-blue-200 text-blue-600 px-3 py-1 rounded-xl shadow-sm">Of students,</span>
                <span class="bg-indigo-50 border border-indigo-200 text-indigo-600 px-3 py-1 rounded-xl shadow-sm">by students,</span>
                <span class="bg-blue-50 border border-blue-200 text-blue-600 px-3 py-1 rounded-xl shadow-sm">for students.</span>
            </p>
        </div>

        <!-- Subjects Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full max-w-4xl mx-auto">
            
            <!-- Microbiology -->
            <a href="notes.html?branch=Microbiology" class="group bg-white p-6 sm:p-8 rounded-3xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                <div class="flex items-start justify-between mb-6">
                    <div class="glow-box h-16 w-16 bg-blue-50 text-accent rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                        <i class="ph-fill ph-microscope"></i>
                    </div>
                    <div class="h-10 w-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 group-hover:bg-primary group-hover:text-white transition-colors">
                        <i class="ph ph-arrow-up-right"></i>
                    </div>
                </div>
                <h3 class="font-bold text-2xl text-primary mb-2">Microbiology</h3>
                <p class="text-slate-500">Major, Zoology, Chemistry & SEC materials</p>
            </a>

            <!-- Mathematics -->
            <a href="notes.html?branch=Mathematics" class="group bg-white p-6 sm:p-8 rounded-3xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                <div class="flex items-start justify-between mb-6">
                    <div class="glow-box h-16 w-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                        <i class="ph-fill ph-function"></i>
                    </div>
                    <div class="h-10 w-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 group-hover:bg-primary group-hover:text-white transition-colors">
                        <i class="ph ph-arrow-up-right"></i>
                    </div>
                </div>
                <h3 class="font-bold text-2xl text-primary mb-2">Mathematics</h3>
                <p class="text-slate-500">Calculus, Algebra & Equations</p>
            </a>

        </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-6 text-center flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-primary text-white font-bold text-xs h-6 w-6 flex items-center justify-center rounded-md">SB</div>
                <span class="font-semibold text-primary text-sm">StudyBSc</span>
            </div>
            <p class="text-slate-400 text-sm">&copy; 2026. Designed for excellence.</p>
        </div>
    </footer>

    <!-- WhatsApp Floating Action Button -->
    <a href="https://wa.me/919227838831" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-4 md:bottom-8 md:right-8 flex flex-col items-center gap-2 group z-50 transition-transform active:scale-90">
        <div class="relative flex items-center justify-center h-16 w-16 rounded-full bg-white/40 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] border border-white/60 overflow-hidden transition-all duration-500 group-hover:shadow-[0_0_20px_rgba(37,211,102,0.4)] group-hover:-translate-y-1">
            <!-- Shimmer -->
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/80 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
            <!-- Icon -->
            <i class="ph ph-whatsapp-logo text-[40px] text-[#25D366] relative z-10 group-hover:scale-110 transition-transform duration-500 ease-out drop-shadow-sm"></i>
        </div>
        <span class="text-[10px] font-semibold text-slate-500 text-center leading-tight">
            Suggest / Contact<br>Developer
        </span>
    </a>

</body>
</html>
